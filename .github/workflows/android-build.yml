name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        type: choice
        options:
          - both
          - debug
          - release
        default: both

concurrency:
  group: android-build-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 不使用 android-actions/setup-android：该 action 默认安装 'tools platform-tools'，
      # 而 Google 已从 SDK 仓库移除独立的 tools 包，sdkmanager 会直接退出 1。
      # hosted runner 镜像自带 Android SDK，此处只接受 license，
      # 缺失的 platform / build-tools / NDK / CMake 由 AGP 构建时按需自动下载。
      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Build APKs
        run: |
          chmod +x gradlew
          case "$BUILD_TYPE" in
            debug)   GRADLE_TASKS="assembleDebug" ;;
            release) GRADLE_TASKS="assembleRelease" ;;
            both)    GRADLE_TASKS="assembleDebug assembleRelease" ;;
            *)       echo "未知编译类型: $BUILD_TYPE"; exit 1 ;;
          esac
          ./gradlew --stacktrace $GRADLE_TASKS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: QposSetup-apk-${{ inputs.build_type }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
