// 平台签名：Key_Tyveits.jks 需要自行放入 app/ 目录（当前仓库只带了 .pem 证书）
def platformKeystore = file('Key_Tyveits.jks')

android {
    // AGP 9 移除了 aaptOptions DSL，改由 androidResources 传入 aapt2 参数
    androidResources {
        additionalParameters += ["--package-id", "0x8f"]
    }
    signingConfigs {
        if (platformKeystore.exists()) {
            mig_tyt {
                storeFile platformKeystore
                storePassword 'l114514ht'
                keyAlias 'mig'
                keyPassword 'l114514ht'
            }
        }
    }
    namespace 'com.android.setup'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.android.setup"
        minSdk 29
        //noinspection ExpiredTargetSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64", "x86"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            // 包体精简：R8 代码压缩/混淆 + 无用资源剔除
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = platformKeystore.exists() ? signingConfigs.getByName("mig_tyt") : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

